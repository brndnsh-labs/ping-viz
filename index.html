<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <title>Round Trip</title>
    <meta name="description" content="What happens when you type ping google.com and press Enter, in as much detail as fits. Then the same question for a prompt to Claude." />
    <meta property="og:title" content="Round Trip" />
    <meta property="og:description" content="What happens when you type ping google.com and press Enter, in as much detail as fits. Then the same question for a prompt to Claude." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ping-viz.brndn.zip/" />
    <meta property="og:image" content="https://ping-viz.brndn.zip/poster.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/recursive-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Umami (cookieless, self-hosted). data-domains keeps dev, localhost and screenshots silent. -->
    <script
      defer
      src="https://umami.brndn.zip/telemetry.js"
      data-website-id="a249db82-da28-4b08-bd84-382da8bc304c"
      data-domains="ping-viz.brndn.zip"
    ></script>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <header id="hud" class="hud">
      <div class="progress" aria-hidden="true"><div id="hud-progress"></div></div>
      <a class="brand" href="#intro">round trip</a>
      <div id="autoplay" class="autoplay">
        <button type="button" class="ap-play" aria-label="Autoplay" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 9 5 2 9z" /></svg>
          <svg class="i-pause" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z" /></svg>
          <span class="ap-word" aria-hidden="true">play</span>
        </button>
        <button type="button" class="ap-speed" aria-label="Autoplay speed 1×. Change speed">1×</button>
      </div>
      <span id="hud-act" class="hud-act"></span>
      <div id="hud-clock" class="hud-clock off" aria-live="off">
        <div class="clock"><span class="t">t =</span> <span id="hud-clock-v" class="v">0.000 ms</span></div>
        <div id="hud-since" class="since">since you pressed Enter</div>
        <div id="hud-where" class="where"></div>
      </div>
    </header>
    <nav id="rail" class="rail" aria-label="Chapters"></nav>

    <main id="story" class="story">
      <!-- include: content/intro.html -->
      <!-- include: content/act1.html -->
      <!-- include: content/act2.html -->
      <!-- include: content/outro.html -->
    </main>

    <div id="gpu-note" class="gpu-note" hidden>
      <p><span class="why">This browser doesn't offer WebGPU, so the pictures are off.</span>
        The story reads fine without them. For the full thing, use Chrome, Edge, or Safari 26 or later.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
